studio:
  node_id: velvet-audio-pi3-01
  host_adapter: raspberry_pi_3
  hardware_adapter: audio_injector_octo
  input_channels: 6
  output_channels: 8

capture:
  source: alsa_octo
  identity_terms:
    - audioinjector
    - octo
  pcm_device: 0
  use_plughw: false
  sample_rate_hz: 48000
  sample_format: S32_LE
  period_frames: 480
  heartbeat_interval_ms: 5000
  idle_poll_seconds: 0.01
  retry_journal: /var/lib/velvet-audio/runtime-retry.jsonl
  max_pending_runtime_events: 1024
  backlog_warning_ratio: 0.75
  backlog_max_age_ms: 30000

voice_frontend:
  enabled: true
  activation_rms: 0.03
  deactivation_rms: 0.015
  activation_packets: 2
  release_packets: 3
  pre_roll_ms: 200
  minimum_utterance_ms: 120
  maximum_utterance_ms: 12000

transcription:
  enabled: false
  engine: vosk
  model_path: /var/lib/velvet-audio/models/vosk-model-small-en-us-0.15
  recognizer_sample_rate_hz: 16000
  language: en-us
  include_words: true
  max_alternatives: 0
  log_level: -1
  grammar: []
  queue_capacity: 4
  worker_stop_timeout_seconds: 10.0
  wake_names:
    - hey velvet
    - velvet
    - princess

network:
  transport: ethernet
  event_protocol_transport: stdout
  runtime_endpoint: null
  request_timeout_seconds: 2.0
  bearer_token_file: null
  max_response_bytes: 65536

policy:
  default_lease_seconds: 30
  allow_direct_alsa_access: false
  receipt_required: true
  priorities:
    ambience: 10
    music: 20
    media: 30
    navigation: 50
    call: 60
    velvet_voice: 70
    system_alert: 80
    safety: 100
